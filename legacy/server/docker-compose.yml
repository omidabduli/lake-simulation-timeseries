# LEGACY self-hosting (Streamlit server in Docker). The primary deployment is
# GitHub Pages. Run from the repository root:
#   docker compose -f legacy/server/docker-compose.yml up --build -d
name: lake-time-series-forecasting
services:
  lake-time-series-forecasting:
    build:
      context: ../..
      dockerfile: legacy/server/Dockerfile
    container_name: lake-time-series-forecasting
    init: true
    ports:
      - "8501:8501"
    volumes:
      - ../../logs:/app/logs
    restart: unless-stopped
